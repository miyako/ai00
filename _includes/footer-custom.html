<script>
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll("main table").forEach((table) => {
    const wrapper = document.createElement("div");
    wrapper.className = "table-scroll";
    wrapper.tabIndex = 0;
    wrapper.setAttribute("role", "region");
    const headings = [...document.querySelectorAll("main h2, main h3")];
    const heading = headings.filter((node) =>
      node.compareDocumentPosition(table) & Node.DOCUMENT_POSITION_FOLLOWING
    ).pop();
    const label = heading ? heading.textContent : "Reference";
    wrapper.setAttribute("aria-label", label + " table");
    if (!table.caption) {
      table.createCaption().textContent = label;
    }
    table.querySelectorAll("thead th").forEach((th) => th.scope = "col");
    table.parentNode.insertBefore(wrapper, table);
    wrapper.appendChild(table);
  });

  document.querySelectorAll("pre > code").forEach((codeBlock) => {
    const pre = codeBlock.parentNode;
    pre.tabIndex = 0;
    const wrapper = document.createElement("div");
    wrapper.className = "code-wrapper";
    pre.parentNode.insertBefore(wrapper, pre);
    wrapper.appendChild(pre);

    const button = document.createElement("button");
    button.type = "button";
    button.className = "copy-btn";
    button.setAttribute("data-tooltip", "Copied!");
    button.innerHTML = `
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 24 24">
        <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1z"/>
        <path d="M20 5H8c-1.1 0-2 .9-2 2v16h14c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2z"/>
      </svg>
      Copy
    `;
    wrapper.appendChild(button);
    const status = document.createElement("span");
    status.className = "copy-status";
    status.setAttribute("role", "status");
    wrapper.appendChild(status);

    button.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(codeBlock.innerText);
        status.textContent = "Copied!";
        button.classList.add("show-tooltip");
        setTimeout(() => button.classList.remove("show-tooltip"), 1200);
      } catch (err) {
        status.textContent = "Copy failed. Select the code and copy it manually.";
      }
    });
  });
});
</script>
