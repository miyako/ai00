theme: jekyll-theme-minimal

markdown: kramdown
kramdown:
  syntax_highlighter: rouge
highlighter: rouge
plugins_dir: _plugins
baseurl: /ai00

title: "Ai00"
description: "Local RWKV inference on Mac and Windows, connected to your 4D application."
logo: "/assets/ai00.png"
show_downloads: true       # controls the download links in header
github:
  is_user_page: true
  owner_url: "https://github.com/miyako"
  repository_url: "https://github.com/miyako/ai00"
  is_project_page: false

exclude:
  - ".build"
  - "dist"
  - "scripts"
  - "tests"
  - "upstream.json"
  - "Ai00"
  - "vendor"
  - "resources"
  - "LICENSE"
  - "README.md"
  - "Gemfile"
